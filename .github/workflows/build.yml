name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q University_Pcl_mvp.zip -d project
      - name: Build debug APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: University_Pcl-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
